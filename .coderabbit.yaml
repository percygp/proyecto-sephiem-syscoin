# CodeRabbit — revisión automática de PRs (B3 / VAL-47)
# Ref: https://docs.coderabbit.ai/guides/configure-coderabbit
# El bloqueo efectivo de merge depende de branch protection (VAL-48):
# marcar el check de CodeRabbit como "required" en main y staging.
language: es-ES

reviews:
  profile: assertive
  # CodeRabbit solicita cambios (no solo comenta) cuando detecta problemas.
  # Con branch protection "require review", esto bloquea el merge.
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - staging
  path_filters:
    - "!**/_generated/**"
    - "!dist/**"
    - "!**/package-lock.json"
    - "!**/*.svg"

chat:
  auto_reply: true
